name: Deploy

# Manual deploy. Pick an environment (staging / production) and a target.
# Per-environment values (project ref, db password, …) come from the matching
# GitHub Environment; shared values (Cloudflare/Supabase tokens) can be
# repo-level secrets.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [staging, production]
        default: staging
      target:
        description: 'What to deploy'
        type: choice
        options: [both, worker, supabase]
        default: both

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-worker:
    if: ${{ inputs.target == 'worker' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: cloudflare/opendojo-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare/opendojo-api/package-lock.json
      - run: npm ci
      # production = top-level config; any other env = the matching
      # [env.<name>] block in wrangler.toml.
      - name: Deploy worker
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env "$DEPLOY_ENV"
          fi
        env:
          DEPLOY_ENV:            ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-supabase:
    if: ${{ inputs.target == 'supabase' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Push migrations
        run: supabase db push
      - name: Deploy edge function
        run: supabase functions deploy submit_drill --project-ref "$SUPABASE_PROJECT_REF"
