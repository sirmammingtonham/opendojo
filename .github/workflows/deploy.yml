name: Deploy

# Manual deploy. Trigger from Actions → Deploy → Run workflow and pick a
# target. Requires the deploy secrets configured in repo settings.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        options: [both, worker, supabase]
        default: both

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-worker:
    if: ${{ inputs.target == 'worker' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare/opendojo-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare/opendojo-api/package-lock.json
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-supabase:
    if: ${{ inputs.target == 'supabase' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Push migrations
        run: supabase db push
      - name: Deploy edge function
        run: supabase functions deploy submit_drill --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
