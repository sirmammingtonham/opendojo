# Cloudflare Wrangler config for the opendojo-api Worker.
#
# This file lets you deploy via `wrangler deploy` instead of pasting
# into the dashboard. Most fields below mirror what you'd set via the
# dashboard UI; check them against your account's actual values
# before the first `wrangler deploy`.
#
# To use:
#   npm i -g wrangler
#   wrangler login
#   wrangler deploy
#
# After deploy, attach the custom domain in the dashboard
# (Workers & Pages → opendojo-api → Triggers → Custom Domains) or
# uncomment the routes section below with your zone.

name           = "opendojo-api"
main           = "worker.ts"
compatibility_date = "2026-01-01"

# wrangler bundles TypeScript via esbuild; no separate build step.
# Run `wrangler deploy` to compile + ship in one go, or
# `wrangler deploy --dry-run --outdir dist` if you want the JS bundle
# locally (e.g., to paste into the Cloudflare dashboard editor).

# Project ref of your Supabase project — the prefix of <ref>.supabase.co.
# Override via dashboard if you'd rather not commit it here.
[vars]
SUPABASE_REF = "REPLACE_ME"

# Per-IP rate limits. Each binding is one knob you can tweak later
# without code changes; the Worker picks the right one by URL path.
[[unsafe.bindings]]
name      = "RL_SIGNUP"
type      = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 3600 }

[[unsafe.bindings]]
name      = "RL_SUBMIT"
type      = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 3600 }

[[unsafe.bindings]]
name      = "RL_DOWNLOAD"
type      = "ratelimit"
namespace_id = "1003"
simple = { limit = 100, period = 3600 }

[[unsafe.bindings]]
name      = "RL_REPORT"
type      = "ratelimit"
namespace_id = "1004"
simple = { limit = 20, period = 3600 }

[[unsafe.bindings]]
name      = "RL_LIKE"
type      = "ratelimit"
namespace_id = "1005"
simple = { limit = 200, period = 3600 }

[[unsafe.bindings]]
name      = "RL_AUTH_OTHER"
type      = "ratelimit"
namespace_id = "1006"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name      = "RL_GENERAL"
type      = "ratelimit"
namespace_id = "1007"
simple = { limit = 600, period = 60 }

# To bind a custom domain via wrangler, uncomment + edit:
# [[routes]]
# pattern       = "opendojo.ethan.website/*"
# zone_name     = "ethan.website"
# custom_domain = true
