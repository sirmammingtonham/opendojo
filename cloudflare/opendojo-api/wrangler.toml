name           = "opendojo-api"
main           = "worker.ts"
compatibility_date = "2026-01-01"

[[unsafe.bindings]]
name      = "RL_SIGNUP"
type      = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 3600 }

[[unsafe.bindings]]
name      = "RL_SUBMIT"
type      = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 3600 }

[[unsafe.bindings]]
name      = "RL_DOWNLOAD"
type      = "ratelimit"
namespace_id = "1003"
simple = { limit = 50, period = 3600 }

[[unsafe.bindings]]
name      = "RL_REPORT"
type      = "ratelimit"
namespace_id = "1004"
simple = { limit = 20, period = 3600 }

[[unsafe.bindings]]
name      = "RL_LIKE"
type      = "ratelimit"
namespace_id = "1005"
simple = { limit = 50, period = 3600 }

[[unsafe.bindings]]
name      = "RL_AUTH_OTHER"
type      = "ratelimit"
namespace_id = "1006"
simple = { limit = 240, period = 3600 }

[[unsafe.bindings]]
name      = "RL_GENERAL"
type      = "ratelimit"
namespace_id = "1007"
simple = { limit = 240, period = 3600 }

# Staging — `wrangler deploy --env staging`. Separate script + workers.dev URL,
# its own secrets (set with `--env staging`), and distinct rate-limit
# namespace_ids so it doesn't share prod's buckets.
[env.staging]
name = "opendojo-api-staging"

[[env.staging.unsafe.bindings]]
name      = "RL_SIGNUP"
type      = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 3600 }

[[env.staging.unsafe.bindings]]
name      = "RL_SUBMIT"
type      = "ratelimit"
namespace_id = "2002"
simple = { limit = 20, period = 3600 }

[[env.staging.unsafe.bindings]]
name      = "RL_DOWNLOAD"
type      = "ratelimit"
namespace_id = "2003"
simple = { limit = 50, period = 3600 }

[[env.staging.unsafe.bindings]]
name      = "RL_REPORT"
type      = "ratelimit"
namespace_id = "2004"
simple = { limit = 20, period = 3600 }

[[env.staging.unsafe.bindings]]
name      = "RL_LIKE"
type      = "ratelimit"
namespace_id = "2005"
simple = { limit = 50, period = 3600 }

[[env.staging.unsafe.bindings]]
name      = "RL_AUTH_OTHER"
type      = "ratelimit"
namespace_id = "2006"
simple = { limit = 240, period = 3600 }

[[env.staging.unsafe.bindings]]
name      = "RL_GENERAL"
type      = "ratelimit"
namespace_id = "2007"
simple = { limit = 240, period = 3600 }
